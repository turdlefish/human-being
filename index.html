<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Human Being</title>
  <meta name="description" content="A soft little space for two: daily check-ins, self-care maps and cute time-block plans.">
  <meta name="theme-color" content="#FFF4F8">
  <script>
    // Pick pastel or galaxy before first paint (avoids a flash of the wrong theme).
    try {
      var t = (JSON.parse(localStorage.getItem('tend:prefs')) || {}).theme || 'auto';
      if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Human Being">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><img src="icons/icon.svg" alt="" class="brand-icon">Human Being<span id="mock-badge" class="mock-badge" hidden>test server</span></div>
      <div class="topbar-right">
        <span class="sync" id="sync" data-state="idle" role="status"><span class="dot"></span><span class="sync-txt"></span></span>
        <button type="button" class="duo" id="duo" aria-label="You and your person — open settings"></button>
      </div>
    </header>

    <main id="main">
      <section class="view" id="view-today" data-view="today" aria-label="Today's check-in"></section>
      <section class="view" id="view-map" data-view="map" aria-label="Self-care map"></section>
      <section class="view" id="view-plan" data-view="plan" aria-label="Plans"></section>
      <section class="view" id="view-us" data-view="us" aria-label="Us"></section>
      <div id="tray" aria-label="Sticker drawer"></div>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button type="button" class="tab" data-tab="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/></svg>
        <span>Today</span>
      </button>
      <button type="button" class="tab" data-tab="map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="pot" d="M6.5 14h11l-1.4 6.3a1.6 1.6 0 0 1-1.6 1.2H9.5a1.6 1.6 0 0 1-1.6-1.2z"/><path d="M12 14V9.5"/><path class="leaf" d="M12 10.5C12 7 9.6 4.6 5.6 4.6c0 3.6 2.5 6 6.4 5.9z"/><path class="leaf" d="M12 9.6c0-3.6 2.5-6.1 6.4-6.1 0 3.8-2.5 6.2-6.4 6.1z"/></svg>
        <span>Self-care</span>
      </button>
      <button type="button" class="tab" data-tab="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="4"/><path d="M3.5 9.5h17M8.5 2.8v3.4M15.5 2.8v3.4M7.5 13.5h5M7.5 16.8h8"/></svg>
        <span>Plan</span>
      </button>
      <button type="button" class="tab" data-tab="us">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 18.5S3 15.2 3 11a3.1 3.1 0 0 1 5.6-1.9A3.1 3.1 0 0 1 14.2 11c0 4.2-5.6 7.5-5.6 7.5z"/><path d="M14.6 7.4a3.1 3.1 0 0 1 6.4 1.6c0 3.1-3.6 5.6-4.9 6.4"/></svg>
        <span>Us</span>
      </button>
    </nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
